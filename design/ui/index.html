<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡小西 · iOS UI</title>
<style>
  :root{
    --ink:#0B0B0C; --ink2:#2C2C2E;
    --s2:rgba(60,60,67,.6); --s3:rgba(60,60,67,.32);
    --bg:#F2F2F7; --card:#FFFFFF; --sep:rgba(60,60,67,.12);
    --blue:#2E5F7E; --blue2:#4C7E9C; --blue-soft:rgba(46,95,126,.10);
    --gold:#9A6B12; --gold-soft:rgba(217,164,65,.18);
    --green:#2C7A4B; --green-soft:rgba(52,199,89,.13);
    --red:#B4392C; --red-soft:rgba(255,59,48,.10);
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;background:#E9EDF2;}
  body.single{width:390px;height:844px;overflow:hidden;background:#fff;}
  .screen{
    position:relative; width:390px; height:844px; background:var(--bg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); display:flex; flex-direction:column;
  }
  .status{position:relative;z-index:3;height:47px; flex:0 0 47px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 8px 32px; font-size:15px; font-weight:600; letter-spacing:.2px;}
  .status .right{display:flex; align-items:center; gap:6px;}
  .status svg{display:block;}
  .nav{height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:center; position:relative; font-size:17px; font-weight:600;}
  .nav .back{position:absolute; left:14px; display:flex; align-items:center; gap:2px; color:var(--blue); font-size:17px; font-weight:400;}
  .nav .right{position:absolute; right:16px; color:var(--blue); font-size:17px; font-weight:600;}
  .nav.blur{background:rgba(249,249,249,.86); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--sep);}
  .scroll{flex:1; overflow:hidden; padding:0 16px;}
  .scroll.pb{padding-bottom:24px;}

  .h1{font-size:34px; line-height:41px; font-weight:700; letter-spacing:-.7px; margin:0;}
  .h2{font-size:22px; line-height:28px; font-weight:700; letter-spacing:-.4px; margin:0;}
  .h3{font-size:17px; line-height:22px; font-weight:600; margin:0; letter-spacing:-.2px;}
  .t{font-size:17px; line-height:22px; font-weight:600; letter-spacing:-.2px;}
  .b{font-size:15px; line-height:20px;}
  .s{font-size:15px; line-height:20px; color:var(--s2);}
  .f{font-size:13px; line-height:18px; color:var(--s2);}
  .cap{font-size:12px; line-height:16px; color:var(--s3); letter-spacing:.1px;}
  .mono{font-variant-numeric:tabular-nums;}

  .row{display:flex; align-items:center; gap:12px;}
  .row.between{justify-content:space-between;}
  .col{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .grow{flex:1; min-width:0;}
  .ell{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .card{background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow);}
  .card.flat{box-shadow:none;}
  .card.tint{background:var(--blue-soft); box-shadow:none;}
  .card.gold{background:var(--gold-soft); box-shadow:none;}

  .list{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);}
  .li{display:flex; align-items:center; gap:12px; padding:10px 16px; position:relative; min-height:44px;}
  .li + .li::before{content:""; position:absolute; left:16px; right:0; top:0; height:.5px; background:var(--sep);}
  .li .chev{color:var(--s3); display:flex;}

  .pill{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:6px; font-size:12px; font-weight:600; letter-spacing:0;}
  .pill.blue{background:var(--blue-soft); color:var(--blue);}
  .pill.gold{background:var(--gold-soft); color:var(--gold);}
  .pill.green{background:var(--green-soft); color:var(--green);}
  .pill.red{background:var(--red-soft); color:var(--red);}
  .pill.gray{background:rgba(118,118,128,.10); color:var(--s2);}

  .btn{height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; letter-spacing:-.2px;}
  .btn.primary{background:var(--blue); color:#fff;}
  .btn.tint{background:var(--blue-soft); color:var(--blue);}
  .btn.ghost{background:var(--card); border:.5px solid var(--sep); color:var(--ink);}
  .btn.sm{height:34px; border-radius:10px; font-size:14px; padding:0 14px;}
  .btn:active{opacity:.85;}

  .seg{display:flex; background:rgba(118,118,128,.12); border-radius:9px; padding:2px; height:32px;}
  .seg .it{flex:1; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:var(--ink); border-radius:7px;}
  .seg .it.on{background:#fff; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12);}

  .chip{height:30px; padding:0 12px; border-radius:15px; background:rgba(118,118,128,.10); display:flex; align-items:center; font-size:13px; font-weight:500; color:var(--ink2); white-space:nowrap;}
  .chip.on{background:var(--blue); color:#fff; font-weight:600;}

  .avatar{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:600; flex:0 0 40px;}
  .avatar.sm{width:32px; height:32px; font-size:13px; flex:0 0 32px;}
  .avatar.lg{width:64px; height:64px; font-size:24px; flex:0 0 64px;}
  .bg1{background:linear-gradient(135deg,#7FA3BC,#4F7691);}
  .bg2{background:linear-gradient(135deg,#B6A6C9,#8C79A6);}
  .bg3{background:linear-gradient(135deg,#93BBA5,#5F8C77);}
  .bg4{background:linear-gradient(135deg,#D8B08C,#B07E52);}
  .bg5{background:linear-gradient(135deg,#8FA3C7,#63799F);}

  .thumb{width:56px; height:56px; border-radius:12px; flex:0 0 56px; background:linear-gradient(135deg,#DCE7EE,#B9CEDB); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.9);}
  .hero{height:236px; margin:0 -16px; background:linear-gradient(150deg,#8FAEC0 0%,#5D7F97 55%,#3E6076 100%); position:relative; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.55);}
  .hero .glass{position:absolute; top:14px; left:16px; right:16px; display:flex; justify-content:space-between;}

  .tabbar{height:83px; flex:0 0 83px; background:rgba(249,249,249,.92); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:.5px solid var(--sep); display:flex; padding:8px 8px 0; position:relative;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#8A8A8E; font-size:10px; font-weight:500;}
  .tab.on{color:var(--blue);}
  .tab .ico{height:26px; display:flex; align-items:center;}
  .home{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#0B0B0C; opacity:.85;}
  .pad-home{height:34px; flex:0 0 34px;}

  .section{display:flex; align-items:baseline; justify-content:space-between; margin:22px 4px 8px;}
  .section .more{font-size:15px; color:var(--blue); font-weight:500;}
  .tiny-label{font-size:12px; color:var(--s3); padding:0 4px; margin:20px 0 6px; text-transform:none; letter-spacing:.2px;}

  .formrow{display:flex; align-items:center; justify-content:space-between; min-height:50px; gap:12px;}
  .formrow .k{font-size:17px; color:var(--ink); flex:0 0 auto;}
  .formrow .v{font-size:17px; color:var(--s3); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .formrow .v.filled{color:var(--ink);}
  .split{display:flex; gap:12px;}
  .split .card{flex:1;}

  .launch{position:absolute; inset:0; padding-top:47px; background:linear-gradient(180deg,#F8FBFC 0%,#E7EFF5 60%,#DCE8F0 100%); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .launch .ip{width:168px; height:auto; filter:drop-shadow(0 18px 30px rgba(46,95,126,.18));}
  .float{position:absolute; left:16px; right:16px; bottom:44px;}

  .cd{display:flex; align-items:center; gap:6px; color:var(--blue); font-size:15px; font-weight:600;}
  .dot{width:6px; height:6px; border-radius:3px; background:var(--gold);}
  .divider{height:.5px; background:var(--sep); margin:0 16px;}

  .cal-head{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--s3); font-weight:600; margin:10px 0 4px;}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px;}
  .cal .d{height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:15px; color:var(--ink2); position:relative;}
  .cal .d.mute{color:var(--s3);}
  .cal .d .n{width:30px; height:30px; border-radius:15px; display:flex; align-items:center; justify-content:center;}
  .cal .d.on .n{background:var(--blue); color:#fff; font-weight:600;}
  .cal .d .pt{width:4px; height:4px; border-radius:2px; background:var(--gold); position:absolute; bottom:4px;}
  .cal .d.on .pt{background:#fff;}

  .big{font-size:52px; line-height:56px; font-weight:700; letter-spacing:-1.5px;}
  .stat{flex:1; text-align:center;}
  .stat .n{font-size:22px; font-weight:700; letter-spacing:-.4px;}
  .stat .l{font-size:11px; color:var(--s2); margin-top:2px;}
</style>
</head>
<body class="single">
<div id="app"></div>
<script>
const I = {
  chevL:'<svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chevR:'<svg width="8" height="13" viewBox="0 0 8 13"><path d="M1.5 1.5L6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  camera:'<svg width="42" height="42" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  bell:'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0v5l1.6 3H4.4L6 14V9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 13.5L18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  home:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20H4v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>',
  cal:'<svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16M8 3.5v4M16 3.5v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  person:'<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  clock:'<svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4.2l2.8 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  pin:'<svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 18s6-5.2 6-9.4A6 6 0 004 8.6C4 12.8 10 18 10 18z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="8.4" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  users:'<svg width="16" height="16" viewBox="0 0 20 20"><circle cx="7.5" cy="7" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 17c.9-2.8 3-4.2 5.5-4.2S12 14.2 13 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 5.2a2.6 2.6 0 010 5M15.5 17c-.3-1.5-.9-2.6-1.8-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  share:'<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v9M6.5 6L10 2.6 13.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9v7h10V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  spark:'<svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 2l1.8 5.2L17 9l-5.2 1.8L10 16l-1.8-5.2L3 9l5.2-1.8L10 2z" fill="currentColor"/></svg>',
  doc:'<svg width="16" height="16" viewBox="0 0 20 20"><path d="M5 2h7l3 3v13H5V2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 2v4h4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
};
const sig = '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0B0B0C"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0B0B0C"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#0B0B0C"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0B0B0C" opacity=".35"/></svg>';
const wifi = '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.6l2.2-2.6a3.4 3.4 0 00-4.4 0L8 10.6z" fill="#0B0B0C"/><path d="M3.2 5.6a7 7 0 019.6 0M1 3a10.4 10.4 0 0114 0" fill="none" stroke="#0B0B0C" stroke-width="1.6" stroke-linecap="round"/></svg>';
const batt = '<svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.2" fill="none" stroke="#0B0B0C" opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0B0B0C"/><path d="M23 4v4a2 2 0 000-4z" fill="#0B0B0C" opacity=".4"/></svg>';

function status(){ return `<div class="status"><span>9:41</span><span class="right">${sig}${wifi}${batt}</span></div>`; }
function nav(title, o={}){
  return `<div class="nav ${o.blur?'blur':''}">${o.back?`<span class="back">${I.chevL}<span>返回</span></span>`:''}
    <span>${title||''}</span>${o.right?`<span class="right">${o.right}</span>`:''}</div>`;
}
function tabs(i){
  const items=[['首页',I.home],['任务',I.list],['年历',I.cal],['我的',I.person]];
  return `<div class="tabbar">${items.map(([n,ico],k)=>`<div class="tab ${k===i?'on':''}"><span class="ico">${ico}</span><span>${n}</span></div>`).join('')}<div class="home"></div></div>`;
}
function shell(body, o={}){
  return `<div class="screen">${status()}${o.nav!==false?nav(o.title||'',o):''}<div class="scroll ${o.pb?'pb':''}">${body}</div>${o.tab!==undefined?tabs(o.tab):''}${o.bottom||''}${o.tab===undefined?'<div class="pad-home"></div>':''}</div>`;
}
const S = {};
const cta = (inner) => `<div style="padding:8px 16px 4px;background:linear-gradient(180deg,rgba(242,242,247,0) 0%,#F2F2F7 40%)">${inner}</div>`;
const h1 = (t, sub) => `<div style="padding:4px 0 2px"><h1 class="h1">${t}</h1>${sub?`<p class="f" style="margin:2px 0 0">${sub}</p>`:''}</div>`;
const sec = (t, more) => `<div class="section"><span class="h3">${t}</span>${more?`<span class="more">${more}</span>`:''}</div>`;

/* 01 */
S['01'] = `<div class="screen">
  ${status()}
  <div class="launch">
    <img class="ip" src="kaxiaoxi-t.png">
    <div style="font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:22px">卡小西</div>
    <div class="s" style="margin-top:8px">广工影协指南 · 内部版</div>
    <div class="float">
      <div class="btn primary">微信一键登录</div>
      <div class="cap" style="text-align:center;margin-top:14px">登录即表示同意《用户协议》与《隐私政策》</div>
    </div>
    <div class="home" style="bottom:8px"></div>
  </div>
</div>`;

/* 02 */
S['02'] = shell(`
  ${h1('完善资料','提交后由主席审核，通过后即可使用')}
  <div class="list" style="margin-top:14px">
    <div class="li formrow"><span class="k">姓名</span><span class="v filled">张三</span></div>
    <div class="li formrow"><span class="k">学号</span><span class="v filled mono">3124001234</span></div>
    <div class="li formrow"><span class="k">学院</span><span class="v">请选择</span><span class="chev">${I.chevR}</span></div>
    <div class="li formrow"><span class="k">手机号</span><span class="v filled mono">138 0013 8000</span></div>
    <div class="li formrow"><span class="k">宿舍号</span><span class="v filled">东一636</span></div>
    <div class="li formrow"><span class="k">部门</span><span class="v filled">摄影师队</span><span class="chev">${I.chevR}</span></div>
  </div>
  <p class="f" style="margin:10px 4px 0">宿舍格式：东/西 + 楼号 + 房号，如 东一636</p>
  <p class="f" style="margin:6px 4px 0">学号唯一，注册后不可自行修改</p>
`, {title:'注册', back:true, bottom:cta(`<div class="btn primary">提交申请</div>`)});

/* 03 */
S['03'] = shell(`
  <div style="display:flex;flex-direction:column;align-items:center;padding-top:120px">
    <div style="width:86px;height:86px;border-radius:43px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;color:var(--blue)">${I.bell}</div>
    <div class="h2" style="margin-top:24px">申请已提交</div>
    <div class="s" style="margin-top:8px;text-align:center;line-height:22px">主席审核通过后会通知你<br>一般 1～2 天</div>
    <div class="btn tint" style="margin-top:28px;width:180px">联系主席</div>
  </div>
`, {title:'入会申请', back:true});

/* 04 */
S['04'] = shell(`
  <div class="row between" style="margin-top:12px">
    <div><h1 class="h1" style="font-size:28px">上午好，张三</h1><p class="f" style="margin:3px 0 0">摄影师队 · 小干 · 11月16日 周一</p></div>
    <div class="avatar lg bg1">张</div>
  </div>

  <div class="card tint" style="margin-top:16px;padding:12px 14px">
    <div class="row between"><span class="t">发布</span><span class="f">搬砖 · 待办 · 日程</span></div>
    <div class="row" style="gap:8px;margin-top:10px">
      <div class="btn tint sm grow" style="background:#fff">＋ 搬砖</div>
      <div class="btn tint sm grow" style="background:#fff">＋ 待办</div>
      <div class="btn tint sm grow" style="background:#fff">＋ 日程</div>
    </div>
  </div>

  ${sec('近期任务','全部')}
  <div class="card" style="margin-bottom:12px;padding:14px">
    <div class="row between"><span class="pill blue">报名中</span><span class="f">11-19 20:00 截止</span></div>
    <div class="row" style="margin-top:8px">
      <div class="grow"><div class="t">中心湖人像外拍</div><div class="f" style="margin-top:2px">11-21 ~ 11-22 · 大学城中心湖</div></div>
      <div class="thumb" style="width:48px;height:48px;flex:0 0 48px">${I.camera}</div>
    </div>
    <div class="row" style="gap:6px;margin-top:10px"><span class="pill gray">4/6 人 · 候补 2</span><span class="pill gold">二课 4 学时</span></div>
  </div>
